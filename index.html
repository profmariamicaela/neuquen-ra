<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title> TEST Experiencia RA</title>

  <!-- A-Frame (Versión compatible con AR.js) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- AR.js con soporte de Location-Based AR -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <!-- A-Frame Extras para reproducir animaciones de modelos GLB -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Cartel superior de instrucciones y distancia */
    #ui-banner {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      padding: 14px 18px;
      border-radius: 14px;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 10000;
      transition: all 0.3s ease;
    }

    #ui-subtext {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Pantalla de inicio para forzar la interacción del usuario (requerido por iOS/Android) */
    #start-overlay {
      position: fixed;
      inset: 0;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 20000;
    }

    #start-btn {
      margin-top: 24px;
      padding: 14px 28px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- Overlay para solicitar permisos de movimiento y cámara -->
  <div id="start-overlay">
    <h2>Turismo Neuquén RA</h2>
    <p>Para comenzar la experiencia interactiva, necesitamos acceso a tu cámara, ubicación y orientación.</p>
    <button id="start-btn">Iniciar Recorrido</button>
  </div>

  <!-- Cartel flotante de navegación -->
  <div id="ui-banner">
    <div id="ui-text">Esperando señal de GPS...</div>
    <div id="ui-subtext"></div>
  </div>

  <!-- Escena de Realidad Aumentada -->
  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true;">

    <!-- Precarga de Modelos 3D -->
    <a-assets>
      <a-asset-item id="dinoRunModel" src="dinorun.glb"></a-asset-item>
      <a-asset-item id="dinoModel" src="dino.glb"></a-asset-item>
    </a-assets>

    <!-- Cámara conectada al GPS y sensores del dispositivo -->
    <a-camera gps-camera rotation-reader></a-camera>

    <!-- Estación 1 -->
    <a-entity
      id="station-1"
      gps-entity-place="latitude: -34.640281; longitude: -58.476387;"
      gltf-model="#dinoRunModel"
      animation-mixer
      scale="0.5 0.5 0.5"
      position="0 -1.5 0"
      visible="false">
    </a-entity>

    <!-- Estación 2 -->
    <a-entity
      id="station-2"
      gps-entity-place="latitude: -34.640104; longitude: -58.476943;"
      gltf-model="#dinoModel"
      animation-mixer
      scale="0.5 0.5 0.5"
      position="0 -1.5 0"
      visible="false">
    </a-entity>

  </a-scene>

  <script>
    // Configuración de las estaciones
    const STATIONS = [
      {
        id: "station-1",
        name: "Estación 1",
        lat: -34.640281,
        lng: -58.476387,
        triggerRadius: 15 // Radio de activación en metros (cuando está a menos de 15m se muestra)
      },
      {
        id: "station-2",
        name: "Estación 2",
        lat: -34.640104,
        lng: -58.476943,
        triggerRadius: 15
      }
    ];

    const uiText = document.getElementById("ui-text");
    const uiSubtext = document.getElementById("ui-subtext");
    const overlay = document.getElementById("start-overlay");
    const startBtn = document.getElementById("start-btn");

    // Cálculo de distancia entre dos coordenadas en metros (Fórmula de Haversine)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // Radio de la tierra en metros
      const phi1 = lat1 * Math.PI / 180;
      const phi2 = lat2 * Math.PI / 180;
      const deltaPhi = (lat2 - lat1) * Math.PI / 180;
      const deltaLambda = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                Math.cos(phi1) * Math.cos(phi2) *
                Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return R * c;
    }

    // Actualización de estado en base a la ubicación
    function handleLocationUpdate(userLat, userLng) {
      let nearestStation = null;
      let minDistance = Infinity;
      let activeStation = null;

      STATIONS.forEach((station) => {
        const dist = calculateDistance(userLat, userLng, station.lat, station.lng);
        station.currentDistance = dist;

        const entity = document.getElementById(station.id);

        if (dist <= station.triggerRadius) {
          // El usuario está dentro del rango: mostrar modelo anclado
          if (entity) entity.setAttribute("visible", "true");
          activeStation = station;
        } else {
          // Fuera de rango: ocultar para optimizar rendimiento
          if (entity) entity.setAttribute("visible", "false");
        }

        if (dist < minDistance) {
          minDistance = dist;
          nearestStation = station;
        }
      });

      // Lógica de mensajes en pantalla
      if (activeStation) {
        uiText.innerHTML = "✨ ¡Has llegado a la estación!<br><strong>Explora el espacio con tu celular para ver cosas increíbles.</strong>";
        uiSubtext.innerText = `Ubicación: ${activeStation.name}`;
      } else if (nearestStation) {
        const distFormatted = Math.round(minDistance);
        uiText.innerHTML = `Próximo punto: <strong>${nearestStation.name}</strong>`;
        uiSubtext.innerText = `Estás a aproximadamente ${distFormatted} metros`;
      }
    }

    // Inicialización de sensores y GPS
    startBtn.addEventListener("click", async () => {
      // Requerido en iOS Safari para el uso del giroscopio/brújula
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        try {
          await DeviceOrientationEvent.requestPermission();
        } catch (e) {
          console.error("Permiso de orientación denegado:", e);
        }
      }

      overlay.style.display = "none";

      // Escuchar eventos de GPS provistos por AR.js
      window.addEventListener("gps-camera-update-position", (e) => {
        const { latitude, longitude } = e.detail.position;
        handleLocationUpdate(latitude, longitude);
      });

      // Monitoreo nativo continuo por si el evento de AR.js tarda en disparar
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            handleLocationUpdate(pos.coords.latitude, pos.coords.longitude);
          },
          (err) => {
            console.error(err);
            uiText.innerText = "Por favor activa el GPS de alta precisión en tu teléfono.";
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );
      }
    });
  </script>
</body>
</html>
